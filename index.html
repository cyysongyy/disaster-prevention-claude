<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辰光國小防災演練挑戰 115年度</title>
<style>
:root {
  --bg: #0a0f1e;
  --panel: #131c2e;
  --panel2: #1a2540;
  --border: #2a3a5c;
  --lime: #a3e635;
  --lime2: #65a30d;
  --red: #ef4444;
  --blue: #38bdf8;
  --orange: #fb923c;
  --text: #e2e8f0;
  --muted: #64748b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── STARS BG ─── */
.stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.star { position: absolute; border-radius: 50%; background: white; animation: twinkle var(--d) infinite; opacity: 0; }
@keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:var(--o)} }

/* ─── SCREENS ─── */
.screen { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.hidden { display: none !important; }

/* ─── INTRO ─── */
#intro { justify-content: center; text-align: center; }
.intro-logo { font-size: 5rem; margin-bottom: 1rem; animation: bounce 2s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.intro-title { font-size: 2.2rem; font-weight: 900; color: var(--lime); line-height: 1.2; margin-bottom: .5rem; }
.intro-sub { color: var(--muted); margin-bottom: .5rem; font-size: .95rem; }
.intro-date { display: inline-block; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 18px; font-size: .85rem; color: var(--blue); margin-bottom: 2rem; }

/* ─── SCENARIO CARD & QR ─── */
.scenario-card {
  background: linear-gradient(135deg, #1a2540, #0f172a);
  border: 1px solid #2a3a6c;
  border-radius: 16px;
  padding: 1.25rem 1.75rem;
  max-width: 620px;
  text-align: left;
  margin-bottom: 2rem;
  font-size: .9rem;
  line-height: 1.7;
}
.scenario-card .sc-title { color: var(--orange); font-weight: 700; margin-bottom: .5rem; font-size: 1rem; }
.scenario-card .sc-tag { display: inline-block; background: #7f1d1d; color: #fca5a5; border-radius: 4px; font-size: .72rem; padding: 2px 8px; margin-right: 6px; }

.qr-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: rgba(0, 0, 0, 0.2);
  border: 1px dashed var(--border);
  border-radius: 12px;
  padding: 1rem;
  margin-top: 1rem;
}
.qr-title {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--lime);
  margin-bottom: 0.5rem;
  letter-spacing: 1px;
}
.qr-image {
  width: 120px;
  height: 120px;
  border-radius: 8px;
  background: white;
  padding: 5px;
}

.lang-btns { display: flex; gap: 10px; margin-bottom: 1.5rem; }
.lang-btn { padding: 8px 22px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--panel2); color: var(--text); cursor: pointer; font-weight: 700; transition: all .2s; font-size: .85rem; }
.lang-btn.active, .lang-btn:hover { background: var(--lime); color: #000; border-color: var(--lime); }

/* ─── ROLE SELECT ─── */
#role-select { justify-content: flex-start; }
.section-title { font-size: 1.4rem; font-weight: 900; color: var(--lime); margin: 1.5rem 0 .4rem; }
.section-sub { color: var(--muted); font-size: .85rem; margin-bottom: 1.5rem; }
.role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; width: 100%; max-width: 700px; }
.role-card {
  background: var(--panel);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 1.25rem 1rem;
  cursor: pointer;
  text-align: center;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.role-card:hover { border-color: var(--lime); transform: translateY(-3px); background: var(--panel2); }
.role-card .role-icon { font-size: 2.6rem; margin-bottom: .5rem; }
.role-card .role-name { font-weight: 800; font-size: 1rem; margin-bottom: .25rem; }
.role-card .role-desc { font-size: .72rem; color: var(--muted); }
.role-card .role-badge {
  position: absolute; top: 8px; right: 8px;
  background: var(--lime2); color: #000; border-radius: 10px;
  font-size: .62rem; padding: 2px 7px; font-weight: 800;
}

/* ─── GAME UI ─── */
#game { justify-content: flex-start; }
.hud {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; max-width: 680px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 16px; margin-bottom: 16px;
}
.hud-role { display: flex; align-items: center; gap: 8px; }
.hud-badge { background: var(--lime); color: #000; border-radius: 6px; padding: 3px 10px; font-size: .8rem; font-weight: 800; }
.hud-time-label { font-size: .75rem; color: var(--muted); }
.hud-time-val { font-size: .9rem; font-weight: 700; color: var(--blue); }
.hud-score { text-align: right; }
.hud-score-val { font-size: 1.1rem; font-weight: 900; color: var(--lime); }
.hud-score-label { font-size: .7rem; color: var(--muted); }

.phase-track {
  display: flex; align-items: center; gap: 6px;
  width: 100%; max-width: 680px; margin-bottom: 16px;
}
.phase-dot {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: .65rem; font-weight: 700; color: var(--muted);
  flex-shrink: 0; transition: all .3s;
}
.phase-dot.done { background: var(--lime2); border-color: var(--lime); color: #000; }
.phase-dot.active { background: var(--lime); border-color: var(--lime); color: #000; box-shadow: 0 0 12px var(--lime); }
.phase-line { flex: 1; height: 2px; background: var(--border); border-radius: 2px; }
.phase-line.done { background: var(--lime2); }

.mission-card {
  width: 100%; max-width: 680px;
  background: var(--panel);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 1.5rem;
  margin-bottom: 1rem;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.mission-phase-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: #1e3a5f; border: 1px solid #2a5a9f;
  border-radius: 8px; padding: 4px 12px;
  font-size: .75rem; color: var(--blue); font-weight: 700;
  margin-bottom: .75rem;
}
.mission-title { font-size: 1.15rem; font-weight: 900; color: var(--lime); margin-bottom: .5rem; border-left: 3px solid var(--lime); padding-left: .6rem; }
.mission-scenario { color: #94a3b8; font-size: .9rem; line-height: 1.7; margin-bottom: 1rem; }

.timer-wrap { margin-bottom: 1.25rem; }
.timer-label { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); margin-bottom: 4px; }
.timer-bar-bg { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.timer-bar { height: 100%; background: var(--lime); border-radius: 3px; transition: width .1s linear, background .3s; }
.timer-bar.warn { background: var(--orange); }
.timer-bar.danger { background: var(--red); }

.speech-bubble-wrap { margin-bottom: 1rem; }
.speech-bubble {
  background: #1e3a1e; border: 1.5px solid #4ade80;
  border-radius: 14px; padding: .75rem 1rem;
  font-size: .85rem; color: #86efac;
  position: relative; display: flex; align-items: flex-start; gap: 8px;
}
.speech-bubble .sb-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
.speech-bubble .sb-speaking { animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.options-list { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 10px; }
.opt-btn {
  background: var(--panel2); border: 1.5px solid var(--border);
  border-radius: 14px; padding: 1rem 1.25rem;
  cursor: pointer; display: flex; align-items: center; gap: 12px;
  text-align: left; color: var(--text); font-size: .9rem;
  transition: all .2s; width: 100%;
}
.opt-btn:hover { border-color: var(--lime); background: #1a2e1a; transform: translateX(4px); }
.opt-btn .opt-icon { font-size: 1.6rem; flex-shrink: 0; }
.opt-btn .opt-text { font-weight: 600; line-height: 1.4; }
.opt-btn.correct { border-color: #4ade80; background: #14532d; animation: correctFlash .4s; }
.opt-btn.wrong { border-color: var(--red); background: #450a0a; animation: wrongShake .4s; }
@keyframes correctFlash { 0%,100%{transform:scale(1)} 50%{transform:scale(1.02)} }
@keyframes wrongShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

.feedback-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.feedback-box {
  padding: 1.5rem 3rem; border-radius: 20px;
  font-size: 1.4rem; font-weight: 900;
  animation: feedbackPop .4s ease;
  text-align: center;
}
@keyframes feedbackPop { from{transform:scale(.7);opacity:0} 70%{transform:scale(1.08)} to{transform:scale(1);opacity:1} }
.feedback-box.ok { background: #14532d; border: 2px solid #4ade80; color: #4ade80; }
.feedback-box.fail { background: #450a0a; border: 2px solid #ef4444; color: #ef4444; }

#end { justify-content: center; text-align: center; }
.trophy { font-size: 5rem; animation: bounce 1.5s infinite; }
.end-title { font-size: 2rem; font-weight: 900; color: var(--lime); margin: 1rem 0 .5rem; }
.score-display {
  background: var(--panel); border: 1.5px solid var(--border);
  border-radius: 16px; padding: 1.25rem 2rem;
  display: inline-block; margin: 1rem 0;
}
.score-big { font-size: 3.5rem; font-weight: 900; color: var(--lime); line-height: 1; }
.score-max { font-size: 1rem; color: var(--muted); }
.stats-row { display: flex; gap: 16px; justify-content: center; margin: .75rem 0 1.5rem; flex-wrap: wrap; }
.stat-chip {
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 10px; padding: .5rem 1rem; font-size: .8rem;
}
.stat-chip span { color: var(--lime); font-weight: 800; }
.rank-badge {
  display: inline-block;
  padding: .5rem 2rem; border-radius: 24px; font-size: 1.1rem; font-weight: 900;
  margin-bottom: 1.5rem;
}
.rank-S { background: linear-gradient(135deg,#fbbf24,#f59e0b); color: #000; }
.rank-A { background: linear-gradient(135deg,var(--lime),var(--lime2)); color: #000; }
.rank-B { background: linear-gradient(135deg,#38bdf8,#0284c7); color: #000; }
.rank-C { background: linear-gradient(135deg,#a78bfa,#7c3aed); color: #fff; }
.rank-D { background: linear-gradient(135deg,#64748b,#334155); color: #fff; }

.btn-primary {
  background: var(--lime); color: #000;
  border: none; border-radius: 999px;
  padding: 14px 40px; font-size: 1rem; font-weight: 900;
  cursor: pointer; transition: all .2s; display: inline-block;
}
.btn-primary:hover { background: #bef264; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(163,230,53,.3); }
.btn-secondary {
  background: transparent; color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: 999px; padding: 12px 32px;
  font-size: .9rem; font-weight: 700; cursor: pointer; transition: all .2s;
}
.btn-secondary:hover { border-color: var(--lime); color: var(--lime); }
.btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.hint-strip {
  width: 100%; max-width: 680px;
  background: #1e1a0a; border: 1px solid #713f12;
  border-radius: 10px; padding: .6rem 1rem;
  font-size: .78rem; color: #fbbf24;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: .75rem; animation: fadeIn .3s;
}

@media(max-width:480px) {
  .intro-title { font-size: 1.6rem; }
  .role-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
